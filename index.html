<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI - Gemini Clone</title>
    <!-- External Dependencies (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #131314; color: #e3e3e3; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        /* Gemini Glow Effects */
        .gemini-gradient {
            background: linear-gradient(70deg, #4285f4 0%, #9b72cb 30%, #d96570 60%, #4285f4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-container { height: calc(100vh - 160px); }
        .sidebar { background-color: #1e1f20; transition: all 0.3s ease; }
        
        /* Markdown Styling */
        .prose pre { background: #000; padding: 1rem; border-radius: 0.5rem; margin: 0.5rem 0; overflow-x: auto; }
        .prose code { font-family: monospace; color: #9b72cb; }
        .prose p { margin-bottom: 1rem; line-height: 1.6; }
        
        /* Modal Backdrop */
        #settingsModal { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="flex overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar w-64 flex-shrink-0 h-screen flex flex-col z-20 transition-transform -translate-x-full md:translate-x-0 absolute md:relative">
        <div class="p-4">
            <button onclick="createNewChat()" class="w-full flex items-center gap-3 px-4 py-3 bg-[#1a1a1c] hover:bg-[#282a2d] rounded-full text-sm font-medium transition-colors">
                <i data-lucide="plus" class="w-5 h-5"></i>
                New chat
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto px-2 space-y-1" id="chatHistory">
            <!-- History Items Inject Here -->
        </div>

        <div class="p-4 border-t border-[#333]">
            <button onclick="toggleSettings()" class="w-full flex items-center gap-3 px-4 py-3 hover:bg-[#282a2d] rounded-lg text-sm transition-colors">
                <i data-lucide="settings" class="w-5 h-5"></i>
                Settings
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative h-screen w-full">
        <!-- Header -->
        <header class="flex items-center justify-between p-4 md:px-8">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden p-2 hover:bg-[#282a2d] rounded-full">
                    <i data-lucide="menu"></i>
                </button>
                <h1 class="text-xl font-medium tracking-tight flex items-center gap-2">
                    Universal AI <span class="text-xs bg-[#333] px-2 py-0.5 rounded uppercase text-gray-400">v1.0</span>
                </h1>
            </div>
            <div class="flex items-center gap-4" id="modelBadge">
                <!-- Active Model Name Shown Here -->
            </div>
        </header>

        <!-- Chat Area -->
        <div id="chatWindow" class="chat-container flex-1 overflow-y-auto px-4 py-8 md:px-24">
            <div id="welcomeMessage" class="h-full flex flex-col items-center justify-center text-center space-y-6">
                <h2 class="text-4xl md:text-5xl font-medium gemini-gradient">Hello, how can I help?</h2>
                <p class="text-gray-400 max-w-md">I am powered by OpenRouter. Save your API key in settings to start chatting with any model.</p>
            </div>
            <div id="messagesList" class="space-y-8 max-w-4xl mx-auto">
                <!-- Messages Inject Here -->
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 md:p-8 bg-[#131314]">
            <div class="max-w-4xl mx-auto relative group">
                <div class="flex items-end gap-2 bg-[#1e1f20] border border-transparent focus-within:border-[#444] rounded-[28px] px-4 py-2 transition-all shadow-xl">
                    <textarea 
                        id="userInput" 
                        rows="1"
                        placeholder="Enter a prompt here..."
                        class="flex-1 bg-transparent border-none focus:ring-0 text-white py-3 resize-none max-h-48 overflow-y-auto"
                        oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"
                    ></textarea>
                    <div class="flex gap-2 mb-2">
                        <button id="sendBtn" onclick="handleSend()" class="p-2 bg-[#4285f4] hover:bg-[#3b71ca] disabled:opacity-50 disabled:bg-gray-600 text-white rounded-full transition-all">
                            <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
                <p class="text-[10px] text-center text-gray-500 mt-2">OpenRouter may store conversation data. Use responsibly.</p>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="bg-[#1e1f20] w-full max-w-md p-6 rounded-2xl shadow-2xl border border-[#333]">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-medium">Settings</h3>
                <button onclick="toggleSettings()" class="p-1 hover:bg-[#333] rounded-full">
                    <i data-lucide="x"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">OpenRouter API Key</label>
                    <input id="apiKeyInput" type="password" placeholder="sk-or-v1-..." class="w-full bg-[#131314] border border-[#444] rounded-lg px-4 py-2 focus:border-[#4285f4] outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Preferred Model</label>
                    <input id="modelInput" type="text" placeholder="google/gemini-pro-1.5" class="w-full bg-[#131314] border border-[#444] rounded-lg px-4 py-2 focus:border-[#4285f4] outline-none transition-all">
                </div>
                <button onclick="saveSettings()" class="w-full py-3 bg-[#4285f4] hover:bg-[#3b71ca] rounded-lg font-medium transition-all mt-4">
                    Save Configuration
                </button>
            </div>
        </div>
    </div>

    <!-- Script at the end of body to ensure DOM is ready -->
    <script>
        // --- State Management ---
        let state = {
            chats: JSON.parse(localStorage.getItem('gemini_clone_history') || '[]'),
            currentChatId: null,
            settings: JSON.parse(localStorage.getItem('gemini_clone_settings') || '{"apiKey": "", "model": "google/gemini-pro-1.5"}'),
            isSidebarOpen: window.innerWidth > 768
        };

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderHistory();
            updateModelBadge();
            
            // Handle Enter key for sending (Shift+Enter for newline)
            document.getElementById('userInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });
        });

        // --- UI Logic ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            state.isSidebarOpen = !state.isSidebarOpen;
            sidebar.classList.toggle('-translate-x-full');
        }

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            document.getElementById('apiKeyInput').value = state.settings.apiKey;
            document.getElementById('modelInput').value = state.settings.model;
            modal.classList.toggle('hidden');
        }

        function saveSettings() {
            state.settings.apiKey = document.getElementById('apiKeyInput').value.trim();
            state.settings.model = document.getElementById('modelInput').value.trim() || "google/gemini-pro-1.5";
            localStorage.setItem('gemini_clone_settings', JSON.stringify(state.settings));
            updateModelBadge();
            toggleSettings();
        }

        function updateModelBadge() {
            const badge = document.getElementById('modelBadge');
            badge.innerHTML = `<span class="text-sm font-medium text-gray-400">${state.settings.model}</span>`;
        }

        function renderHistory() {
            const container = document.getElementById('chatHistory');
            container.innerHTML = state.chats.map(chat => `
                <div onclick="loadChat('${chat.id}')" class="group flex items-center justify-between p-3 rounded-lg cursor-pointer ${state.currentChatId === chat.id ? 'bg-[#2d2f31]' : 'hover:bg-[#282a2d]'}">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <i data-lucide="message-square" class="w-4 h-4 flex-shrink-0 text-gray-400"></i>
                        <span class="text-sm truncate text-gray-300">${chat.title}</span>
                    </div>
                    <button onclick="deleteChat(event, '${chat.id}')" class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-400 transition-all">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function createNewChat() {
            state.currentChatId = null;
            document.getElementById('messagesList').innerHTML = '';
            document.getElementById('welcomeMessage').classList.remove('hidden');
            document.getElementById('userInput').value = '';
            renderHistory();
        }

        function loadChat(id) {
            const chat = state.chats.find(c => c.id === id);
            if (!chat) return;
            
            state.currentChatId = id;
            document.getElementById('welcomeMessage').classList.add('hidden');
            const list = document.getElementById('messagesList');
            list.innerHTML = '';
            
            chat.messages.forEach(msg => appendMessage(msg.role, msg.content));
            renderHistory();
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            state.chats = state.chats.filter(c => c.id !== id);
            localStorage.setItem('gemini_clone_history', JSON.stringify(state.chats));
            if (state.currentChatId === id) createNewChat();
            else renderHistory();
        }

        // --- Core Chat Logic ---
        async function handleSend() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            const sendBtn = document.getElementById('sendBtn');
            
            if (!text || !state.settings.apiKey) {
                if (!state.settings.apiKey) alert("Please enter your API Key in Settings!");
                return;
            }

            // UI Updates
            input.value = '';
            input.style.height = 'auto';
            document.getElementById('welcomeMessage').classList.add('hidden');
            appendMessage('user', text);
            
            // Create chat session if first message
            if (!state.currentChatId) {
                state.currentChatId = Date.now().toString();
                state.chats.unshift({
                    id: state.currentChatId,
                    title: text.substring(0, 30) + (text.length > 30 ? '...' : ''),
                    messages: []
                });
            }

            const currentChat = state.chats.find(c => c.id === state.currentChatId);
            currentChat.messages.push({ role: 'user', content: text });
            
            // Show Loading State
            sendBtn.disabled = true;
            const loadingId = appendMessage('assistant', 'Thinking...');
            
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${state.settings.apiKey}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href,
                        "X-Title": "Gemini Clone Static Site"
                    },
                    body: JSON.stringify({
                        "model": state.settings.model,
                        "messages": currentChat.messages
                    })
                });

                const data = await response.json();
                const aiContent = data.choices[0].message.content;
                
                // Update State & UI
                updateMessage(loadingId, aiContent);
                currentChat.messages.push({ role: 'assistant', content: aiContent });
                localStorage.setItem('gemini_clone_history', JSON.stringify(state.chats));
                renderHistory();
                
            } catch (error) {
                updateMessage(loadingId, "Error: Failed to fetch response. Check API key/Network.");
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                lucide.createIcons();
            }
        }

        function appendMessage(role, content) {
            const id = 'msg-' + Date.now();
            const list = document.getElementById('messagesList');
            const div = document.createElement('div');
            
            div.className = `flex gap-4 ${role === 'user' ? 'justify-end' : ''}`;
            
            const innerHTML = role === 'user' 
                ? `
                    <div class="bg-[#2d2f31] px-6 py-4 rounded-3xl max-w-[85%] text-gray-200">
                        ${content}
                    </div>
                `
                : `
                    <div class="flex-shrink-0 mt-1">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-[#4285f4] to-[#9b72cb] flex items-center justify-center">
                            <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                        </div>
                    </div>
                    <div id="${id}" class="prose prose-invert max-w-none flex-1">
                        ${marked.parse(content)}
                    </div>
                `;
                
            div.innerHTML = innerHTML;
            list.appendChild(div);
            
            // Scroll to bottom
            const chatWin = document.getElementById('chatWindow');
            chatWin.scrollTo({ top: chatWin.scrollHeight, behavior: 'smooth' });
            
            hljs.highlightAll();
            lucide.createIcons();
            return id;
        }

        function updateMessage(id, content) {
            const el = document.getElementById(id);
            if (el) {
                el.innerHTML = marked.parse(content);
                hljs.highlightAll();
            }
        }
    </script>
</body>
</html>
